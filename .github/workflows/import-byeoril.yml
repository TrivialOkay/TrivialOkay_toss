name: Import Byeoril MVP Source

on:
  push:
    branches:
      - stevechan
    paths:
      - "byeoril-import-package.b64"

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Expand MVP package
        run: |
          base64 --decode byeoril-import-package.b64 > byeoril-import-package.zip
          unzip -o byeoril-import-package.zip
          rm byeoril-import-package.b64
          rm byeoril-import-package.zip
          rm .github/workflows/import-byeoril.yml

      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 별일 앱인토스 MVP 소스 추가"
          git push
